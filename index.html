<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YES TEST | اختبر نفسك وحقق أفضل نتيجة</title>
<meta name="theme-color" content="#01516e">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&family=Playpen+Sans+Arabic:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #01516e; --teal: #01707f; --aqua: #00a6a5; --orange: #fda301; --orange2: #ff8a00;
    --bg: #f1f6f7; --card: #ffffff; --ink: #0e2a35; --muted: #5a7480; --line: #d5e2e6;
    --ok: #1b7f3b; --bad: #b3261e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; overflow-x: hidden; }
  body {
    margin: 0; background: #dfe9eb; color: var(--ink);
    font-family: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, Arial, sans-serif;
    font-size: 16px; line-height: 1.65;
  }
  body.noscroll { overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  h1, h2, h3, p { margin: 0; }
  :focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; }

  /* ---------- splash / login ---------- */
  .splash { min-height: 100dvh; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; background: #fff; position: relative; }
  .splash-top { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 52px 24px 28px; text-align: center; }
  .splash-logo { width: min(400px, 90vw); height: auto; }
  .logo-btn { background: none; border: 0; padding: 0; cursor: pointer; display: block; }
  .featchips { list-style: none; margin: 14px 0 18px; padding: 0; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 380px; }
  .featchips li { background: #eaf6f6; color: var(--navy); border: 1px solid #cfe7e8; border-radius: 999px; padding: 3px 13px; font-size: 14px; font-weight: 500; }
  .featchips li::before { content: "✓ "; color: var(--teal); font-weight: 700; }
  .cta { display: block; width: min(340px, 100%); text-align: center; text-decoration: none; cursor: pointer; font: inherit; font-weight: 700; font-size: 18px; border-radius: 999px; padding: 13px 18px; margin-top: 10px;
    background: linear-gradient(135deg, #ffb52e, #ff8a00); color: #1d2a30; border: 0; box-shadow: 0 6px 18px rgba(253, 163, 1, .45); animation: ctapulse 2.6s ease-in-out infinite; }
  .cta.ghost { background: #fff; color: var(--teal); border: 2px solid var(--teal); box-shadow: none; animation: none; font-size: 16px; padding: 11px 18px; }
  @keyframes ctapulse { 0%, 100% { box-shadow: 0 6px 16px rgba(253, 163, 1, .35); } 50% { box-shadow: 0 6px 28px rgba(253, 163, 1, .8); } }
  .tagline { margin-top: 14px; color: var(--navy); font-weight: 500; font-size: 17px; }
  .splash-bottom {
    position: relative; padding: 78px 26px calc(34px + env(safe-area-inset-bottom));
    background: linear-gradient(165deg, #00a6a5 0%, #01707f 55%, #01516e 100%); color: #fff;
  }
  .wave { position: absolute; top: -1px; left: 0; width: 100%; height: 58px; display: block; }
  .splash-bottom label { display: block; font-weight: 500; margin-bottom: 6px; }
  .code-in {
    width: 100%; font: inherit; font-size: 20px; letter-spacing: .12em; text-align: center; direction: ltr;
    padding: 13px 14px; border-radius: 14px; border: 2px solid transparent; background: #fff; color: var(--ink);
  }
  .pill {
    width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 999px;
    background: var(--navy); color: #fff; font-weight: 700; font-size: 18px;
    box-shadow: 0 6px 18px rgba(1, 40, 56, .35);
  }
  .pill[disabled] { opacity: .65; cursor: wait; }
  .smsg { margin-top: 12px; min-height: 1.6em; text-align: center; font-weight: 500; }
  .smsg.err { background: #fff; color: var(--bad); border-radius: 10px; padding: 8px 12px; }
  .getcode { display: block; margin-top: 10px; text-align: center; color: #fff; text-decoration: underline; }
  .lang-top { position: absolute; top: 14px; inset-inline-end: 14px; z-index: 2; }
  .lang-btn { background: transparent; color: var(--teal); border: 1.5px solid var(--teal); border-radius: 999px; padding: 3px 14px; font-size: 15px; }

  /* ---------- app shell ---------- */
  .app { max-width: 560px; margin: 0 auto; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); position: relative; }
  .appbar {
    position: sticky; top: 0; z-index: 10; display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 16px 14px;
    background: linear-gradient(100deg, var(--navy), var(--teal)); color: #fff; border-radius: 0 0 20px 20px;
  }
  .brandmini { display: flex; align-items: center; gap: 9px; font-size: 20px; letter-spacing: .02em; direction: ltr; }
  .brandmini img { width: 36px; height: 36px; border-radius: 50%; background: #fff; padding: 3px; }
  .brandmini b { font-weight: 700; } .brandmini span { font-weight: 500; opacity: .95; }
  .planbadge { background: rgba(255,255,255,.18); border-radius: 999px; padding: 3px 12px; font-size: 14px; white-space: nowrap; }
  main { flex: 1; min-width: 0; padding: 18px 16px 24px; }
  .tabbar {
    position: sticky; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(4, 1fr);
    background: #fff; border-top: 1px solid var(--line); padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
  }
  .tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 6px 2px; color: var(--muted); font-size: 13px; position: relative; }
  .tab svg { width: 24px; height: 24px; }
  .tab.on { color: var(--teal); font-weight: 700; }
  .tab.on::before { content: ""; position: absolute; top: -7px; width: 28px; height: 3px; border-radius: 3px; background: var(--orange); }
  svg.ic { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .hello { font-size: 24px; font-weight: 700; line-height: 1.3; }
  .hello-sub { color: var(--muted); margin: 2px 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; }
  .plancard { display: flex; flex-direction: column; gap: 8px; margin-bottom: 18px; }
  .plan-row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .plan-name { font-weight: 700; font-size: 18px; color: var(--teal); }
  .meter { height: 9px; background: #e3edee; border-radius: 99px; overflow: hidden; }
  .meter > i { display: block; height: 100%; background: linear-gradient(90deg, var(--aqua), var(--teal)); border-radius: 99px; }
  .muted { color: var(--muted); font-size: 14px; }
  .sec { font-size: 18px; font-weight: 700; margin: 20px 0 10px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ac { text-align: start; border: 0; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 6px; min-height: 112px; }
  .ac .ico { width: 40px; height: 40px; border-radius: 12px; background: rgba(255,255,255,.7); display: grid; place-items: center; color: var(--navy); }
  .ac .ico svg { width: 22px; height: 22px; }
  .ac b { font-size: 16px; line-height: 1.3; } .ac small { color: #38525c; font-size: 13px; line-height: 1.35; }
  .ac.t1 { background: #d3f0ef; } .ac.t2 { background: #dcecfb; } .ac.t3 { background: #fdeccc; } .ac.t4 { background: #e3f5e8; }
  .stats { display: flex; gap: 26px; margin-bottom: 8px; }
  .stats b { font-size: 26px; display: block; line-height: 1.15; } .stats span { color: var(--muted); font-size: 14px; }
  .spark { display: flex; align-items: flex-end; gap: 5px; height: 54px; margin: 8px 0 4px; }
  .spark i { flex: 1; max-width: 26px; background: var(--aqua); border-radius: 3px 3px 0 0; min-height: 3px; }
  .list { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
  .item { min-width: 0; display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .item .grow { flex: 1; min-width: 0; }
  .item .ttl { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 99px; background: #d3f0ef; color: var(--navy); }
  .btn { border-radius: 10px; padding: 8px 16px; font-weight: 700; background: var(--teal); color: #fff; border: 1.5px solid var(--teal); }
  .btn.ghost { background: transparent; color: var(--teal); }
  .btn.warn { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn.big { width: 100%; padding: 13px; font-size: 17px; border-radius: 12px; }
  .btn.orange { background: var(--orange); border-color: var(--orange); color: #1d2a30; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .iconbtn { background: none; border: 0; color: var(--muted); padding: 6px; border-radius: 8px; }
  .empty { text-align: center; color: var(--muted); padding: 22px 10px; }
  .avatar { width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, var(--aqua), var(--navy)); color: #fff; display: grid; place-items: center; font-size: 30px; font-weight: 700; margin: 4px auto 8px; }
  .kv { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .kv:last-child { border-bottom: 0; }
  .stack { display: grid; gap: 10px; }

  /* ---------- sheets ---------- */
  .sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); overflow-y: auto; overflow-x: hidden; }
  .sheet-inner { max-width: 560px; margin: 0 auto; min-height: 100%; background: var(--bg); }
  .sheet-head {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px;
    padding: calc(10px + env(safe-area-inset-top)) 14px 12px; background: linear-gradient(100deg, var(--navy), var(--teal)); color: #fff;
  }
  .sheet-head .back { background: rgba(255,255,255,.18); border: 0; color: #fff; border-radius: 10px; padding: 6px 12px; }
  .sheet-head h2 { flex: 1; min-width: 0; font-size: 18px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer { font-variant-numeric: tabular-nums; background: rgba(255,255,255,.18); border-radius: 99px; padding: 2px 12px; direction: ltr; }
  .timer.low { background: var(--bad); }
  .sheet-body { padding: 16px 16px 40px; }

  /* ---------- forms ---------- */
  .field { margin-bottom: 18px; }
  .lbl { display: block; font-weight: 500; margin-bottom: 6px; }
  .in, select.in, textarea.in {
    width: 100%; font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  textarea.in { min-height: 120px; resize: vertical; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { padding: 6px 14px; border-radius: 999px; border: 1.5px solid var(--line); background: #fff; }
  .chip.on { background: var(--teal); border-color: var(--teal); color: #fff; font-weight: 700; }
  .chip.lock { opacity: .55; }
  .drop { display: block; position: relative; text-align: center; cursor: pointer; border: 2px dashed var(--line); border-radius: 12px; padding: 16px 12px; color: var(--muted); background: #fff; }
  .drop:hover { border-color: var(--teal); }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }
  .drop.has { border-style: solid; border-color: var(--teal); color: var(--ink); font-weight: 500; }
  .drop:focus-within { outline: 3px solid var(--aqua); outline-offset: 2px; }
  .linkbtn { background: none; border: 0; color: var(--bad); font-size: 14px; padding: 4px 0; text-decoration: underline; }
  .check { display: flex; gap: 10px; align-items: flex-start; }
  .check input { width: 20px; height: 20px; margin-top: 3px; accent-color: var(--teal); }
  .row { display: flex; gap: 12px; flex-wrap: wrap; } .row .field { flex: 1 1 140px; }
  .msg { margin-top: 14px; padding: 11px 14px; border-radius: 10px; display: none; }
  .msg.err { display: block; background: #fdecea; color: var(--bad); border: 1px solid #f3c1bd; }
  .msg.wait { display: block; background: #e5f2f3; color: var(--teal); border: 1px solid var(--line); }

  /* ---------- quiz ---------- */
  .qmeta { display: flex; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 14px; margin-bottom: 8px; }
  .bar { height: 8px; background: #e0ebed; border-radius: 99px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--teal); border-radius: 99px; transition: width .25s; }
  .qtext, .qhint, .opt span, .fb, .rev p { overflow-wrap: anywhere; }
  .qtext { font-size: 20px; line-height: 1.5; font-weight: 700; margin: 16px 0 4px; }
  .qhint { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
  .opts { display: grid; gap: 9px; }
  .opt { min-width: 0; display: flex; gap: 10px; align-items: flex-start; text-align: start; width: 100%; background: #fff; border: 1.5px solid var(--line); border-radius: 12px; padding: 11px 13px; }
  .opt .ltr { flex: none; width: 1.8em; height: 1.8em; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--line); font-size: 14px; font-weight: 700; }
  .opt:hover:not([disabled]) { border-color: var(--teal); }
  .opt.sel { border-color: var(--navy); background: #fff4d9; }
  .opt.sel .ltr { background: var(--navy); color: #fff; border-color: var(--navy); }
  .opt.ok { border-color: var(--ok); background: #e6f4ea; } .opt.ok .ltr { background: var(--ok); color: #fff; border-color: var(--ok); }
  .opt.bad { border-color: var(--bad); background: #fdecea; } .opt.bad .ltr { background: var(--bad); color: #fff; border-color: var(--bad); }
  .opt.miss { border-color: var(--ok); border-style: dashed; }
  .opt[disabled] { cursor: default; }
  .fb { margin-top: 14px; padding: 12px 14px; border-radius: 12px; background: #eaf2f3; }
  .fb strong { display: block; } .fb.ok strong { color: var(--ok); } .fb.bad strong { color: var(--bad); } .fb.part strong { color: #8a6400; }
  .qactions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .big { font-size: 46px; font-weight: 700; line-height: 1.1; }
  .tbar { margin: 10px 0; } .tbar .r2 { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; margin-bottom: 3px; }
  .tbar .bar > i.low { background: var(--bad); } .tbar .bar > i.mid { background: var(--orange2); }
  .rev { border-top: 1px solid var(--line); padding-top: 12px; margin-top: 12px; } .rev p { margin: .25em 0; }
  .rev .bad-t { color: var(--bad); } .rev .ok-t { color: var(--ok); }
  .sheet-body .md h2, .md h3, .md h4, .md h5 { line-height: 1.35; margin: 1.2em 0 .35em; }
  .md h2 { font-size: 21px; } .md h3 { font-size: 18px; } .md h4, .md h5 { font-size: 16px; }
  .md p { margin: .55em 0; } .md ul, .md ol { margin: .45em 0; padding-inline-start: 1.4em; } .md li { margin: .2em 0; }


  .ac.t5 { background: #ece4fb; } .ac.t6 { background: #fde3ea; } .ac.t7 { background: #fff3c4; } .ac.t8 { background: #e4e9f2; }
  .paywall { background: linear-gradient(135deg, #fff3d6, #ffe0b8); border: 1.5px solid #f2b45a; border-radius: 16px; padding: 16px; margin-bottom: 16px; text-align: center; }
  .paywall h2 { font-size: 20px; margin-bottom: 4px; } .paywall p { margin: 4px 0; }
  .srcbar { margin-top: 6px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .srcbar .linkbtn { color: var(--teal); }
  .feat { margin: 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .feat li { background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px 9px 12px; display: flex; gap: 10px; align-items: flex-start; }
  .feat li::before { content: "✓"; flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 2px; }
  .offers { display: grid; gap: 12px; }
  .offer { position: relative; background: #fff; border: 1.5px solid var(--line); border-radius: 16px; padding: 16px; }
  .offer.hl { border-color: var(--orange); box-shadow: 0 6px 18px rgba(253, 163, 1, .22); }
  .offer h3 { font-size: 18px; margin: 0 0 2px; } .offer .oprice { font-size: 22px; font-weight: 700; color: var(--teal); margin-bottom: 6px; }
  .offer ul { margin: 0; padding-inline-start: 1.2em; } .offer li { margin: .15em 0; }
  .obadge { position: absolute; top: -11px; inset-inline-end: 14px; background: var(--orange); color: #1d2a30; font-size: 12px; font-weight: 700; padding: 1px 12px; border-radius: 99px; }
  .gpt { margin-top: 18px; background: #eef7f7; border: 1.5px dashed var(--teal); border-radius: 14px; padding: 12px 14px; }
  .gpt h3 { margin: 0 0 4px; font-size: 17px; }
  .samesrc { margin-top: 18px; } .samesrc .lbl { font-size: 14px; color: var(--muted); }
  /* visual learning */
  .mmwrap { overflow: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; margin-top: 8px; -webkit-overflow-scrolling: touch; }
  .mmwrap svg { display: block; }
  .notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 16px; padding: 6px 4px; }
  .note { padding: 14px 16px 16px; border-radius: 4px 4px 14px 4px; box-shadow: 0 6px 14px rgba(20, 40, 50, .18); transform: rotate(var(--r)); font-family: "Playpen Sans Arabic", "Caveat", "IBM Plex Sans Arabic", sans-serif; }
  .note h3 { font-size: 18px; margin: 0 0 6px; line-height: 1.3; }
  .note ul { margin: 0; padding-inline-start: 1.2em; } .note li { margin: .2em 0; line-height: 1.5; }
  .note .tip { margin: 8px 0 0; padding-top: 6px; border-top: 1.5px dashed rgba(0,0,0,.25); font-size: 14px; }
  .vcards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .vcard { background: #fff; border: 1px solid var(--line); border-top: 5px solid var(--teal); border-radius: 14px; padding: 12px 14px 14px; }
  .vcard .vic { font-size: 34px; line-height: 1.1; } .vcard h3 { font-size: 17px; margin: 4px 0; } .vcard p { margin: 4px 0; font-size: 15px; }
  .vcard .hook { background: #fff6d6; border-radius: 8px; padding: 5px 9px; font-size: 14px; }
  .vsteps { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; }
  .vsteps li { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 12px; padding: 9px 12px; position: relative; margin-bottom: 18px; }
  .vsteps li:not(:last-child)::after { content: "↓"; position: absolute; inset-inline-start: 22px; bottom: -19px; color: var(--teal); font-weight: 700; }
  .vsteps .n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .paper { background: #fffdf5; border: 1px solid #e6dfc4; border-radius: 10px; padding: 8px 22px 18px; font-family: "Playpen Sans Arabic", "Caveat", "IBM Plex Sans Arabic", sans-serif; font-size: 17px; line-height: 32px;
    background-image: repeating-linear-gradient(transparent 0, transparent 31px, #cfe0ec 31px, #cfe0ec 32px); border-inline-start: 4px double #e58a8a; }
  .paper h2, .paper h3, .paper h4, .paper h5 { margin: 0; line-height: 32px; font-size: 20px; text-decoration: underline wavy #01707f; text-underline-offset: 5px; }
  .paper p, .paper li { margin: 0; } .paper ul, .paper ol { margin: 0; padding-inline-start: 1.3em; }
  .paper strong { background: linear-gradient(transparent 52%, #ffe27a 52%); font-weight: 700; }

  @media print {
    body { background: #fff; } .app, .splash, #createSheet, .sheet-head, .qactions, .no-print { display: none !important; }
    .sheet { position: static; overflow: visible; } .sheet-body { padding: 0; }
    .note { transform: none; box-shadow: none; border: 1px solid #999; break-inside: avoid; } .mmwrap { overflow: visible; border: 0; } .mmwrap svg { max-width: 100%; height: auto; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<!-- ============ SPLASH / LOGIN ============ -->
<section id="splash" class="splash">
  <div class="lang-top"><button class="lang-btn" data-act="lang" id="langSplash" type="button">Français</button></div>
  <div class="splash-top">
    <button class="logo-btn" data-act="about" data-arg="offers" type="button" data-iaria="aboutLink"><img class="splash-logo" src="logo.png" alt="YES TEST" width="900" height="287"></button>
    <ul class="featchips" aria-hidden="false">
      <li data-i="chip1"></li><li data-i="chip2"></li><li data-i="chip3"></li><li data-i="chip4"></li>
    </ul>
    <button class="cta" data-act="about" data-arg="offers" type="button" data-i="ctaDiscover"></button>
    <a id="getCode" class="cta ghost" data-wa="1" href="#" target="_blank" rel="noopener" hidden data-i="ctaTrial"></a>

/* ---- markdown (safe: everything is escaped first) ---- */
function inline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>"); }
function md(text) {
  let html = "", list = null;
  const close = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (const raw of String(text).split("\n")) {
    const l = raw.trimEnd(); let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); const n = Math.min(m[1].length + 1, 5); html += `<h${n}>${inline(m[2])}</h${n}>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))) { if (list !== "ul") { close(); html += "<ul>"; list = "ul"; } html += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)/))) { if (list !== "ol") { close(); html += `<ol start="${m[1]}">`; list = "ol"; } html += `<li>${inline(m[2])}</li>`; }
    else { close(); html += `<p>${inline(l)}</p>`; }
  }
  close(); return html;
}

async function api(payload) {
  const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });

  return { ok: res.ok, status: res.status, data };
}
function errText(data) {
  const t = tx();
  switch (data && data.reason) {
    case "invalid": return t.eInvalid;
    case "inactive": return t.eInactive;
    case "expired": return fmt(t.eExpired, { d: data.expiresAt ? longDate(data.expiresAt) : "" });
    case "throttled": return t.eThrottled;
    case "quota": return data.quotaType === "total" ? t.eQuotaTotal : t.eQuota;
    case "mode": return t.eMode;
    case "toobig": return fmt(t.eToobig, { n: data.maxFileMb || "" });
    case "empty": return t.eEmpty;
    case "model": case "quizfail": return t.eModel;
    case "busy_day": return t.eBusyDay;
    case "busy_trial": return t.eBusyTrial;
    case "server": return t.eServer;
    default: return t.eGen;
  }
}

async function login(code, auto) {
  const t = tx();

    if (r.ok && r.data.ok) {

  r.forEach((x) => Object.keys(x.topics || {}).forEach((k) => { agg[k] = agg[k] || [0, 0]; agg[k][0] += x.topics[k][0]; agg[k][1] += x.topics[k][1]; }));
  const weak = Object.keys(agg).filter((k) => agg[k][1] >= 2 && agg[k][0] / agg[k][1] < 0.75)
    .sort((a, b) => agg[a][0] / agg[a][1] - agg[b][0] / agg[b][1]).slice(0, 5).map((k) => [k, Math.round((agg[k][0] / agg[k][1]) * 100)]);
  return { count: r.length, avg: sumN ? Math.round((sumP / sumN) * 100) : 0, weak };
}

/* ===================== quiz player ===================== */
function shuffle(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

    const order = shuffle(r.options.map((_, i) => i));
    return { raw: r, q: r.q, topic: r.topic || "", explanation: r.explanation || "",
      options: order.map((i) => r.options[i]),
      correct: order.reduce((acc, orig, pos) => { if (r.correct.includes(orig)) acc.push(pos); return acc; }, []) };
  });
}
function points(it, sel) {

  if (right === cor.size && wrong === 0) return 1;

}

}

  el.textContent = String(Math.floor(left / 60)).padStart(2, "0") + ":" + String(left % 60).padStart(2, "0");
  el.classList.toggle("low", left <= 30);

}

}

      h += `<div class="tbar"><div class="r2"><span>${esc(k)}</span><span>${num(st[k][0])} / ${st[k][1]}</span></div><div class="bar"><i class="${p < 50 ? "low" : p < 75 ? "mid" : ""}" style="width:${p}%"></i></div></div>`; });
  }
  const wrong = quiz.items.map((it, i) => ({ it, r: quiz.res[i] })).filter((x) => x.r && x.r.pts < 1);
  quiz.wrong = wrong.map((x) => x.it.raw);
  if (wrong.length) {
    h += `<h2 class="sec">${t.toReview}</h2>`;
    wrong.forEach(({ it, r }) => { h += `<div class="rev"><p><strong>${esc(it.q)}</strong></p><p class="bad-t">${t.yourAns}: ${ansText(it, r.sel)}</p><p class="ok-t">${t.goodAns}: ${ansText(it, it.correct)}</p>${it.explanation ? `<p>${esc(it.explanation)}</p>` : ""}</div>`; });
  }
  h += sameSourceBar(quiz.mode);
  h += `<div class="qactions">`;
  if (wrong.length) h += `<button class="btn" data-act="retry" type="button">${t.retry}</button>`;
  h += `<button class="btn ghost" data-act="again" type="button">${t.again}</button><button class="btn ghost" data-act="closeView" type="button">${t.done}</button></div>`;
  $("viewBody").innerHTML = h;
}
function closeView() {
  if (quiz && !quiz.done && (quiz.res.length || quiz.sel.length) && !confirm(tx().exitConfirm)) return;
  stopTimer(); quiz = null; lessonOpen = null; closeSheet("viewSheet"); render();
}

/* ===================== events ===================== */
document.addEventListener("click", (e) => {
  if (e.target.closest("a[data-wa]")) track("wa");
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, arg = el.dataset.arg, t = tx();
  switch (a) {
    case "lang": lang = lang === "ar" ? "fr" : "ar"; safeSet("yt_lang", lang); applyLang(); break;
    case "enter": { const c = $("codeIn").value.trim(); if (!c) return splashMsg("err", t.eNoCode); login(c.toUpperCase(), false); break; }
    case "tab": tab = arg; render(); window.scrollTo(0, 0); break;
    case "create": openCreate(arg); break;
    case "closeCreate": closeSheet("createSheet"); break;
    case "setMode": if (!me.modes.includes(arg)) { createMsg("err", t.locked); break; } form.mode = arg; $("createMsg").className = "msg"; buildForm(); break;
    case "clearLesson": clearFile("lesson"); break;
    case "clearStyle": clearFile("style"); break;
    case "createGo": createGo(); break;
    case "openQuiz": { const q = lib.quizzes.find((x) => x.id === arg); if (q) startQuiz(q.items, q.mode, { title: q.title, retry: true }); break; }
    case "delQuiz": lib.quizzes = lib.quizzes.filter((x) => x.id !== arg); saveLib(); render(); break;
    case "openLesson": openLesson(arg); break;
    case "delLesson": lib.lessons = lib.lessons.filter((x) => x.id !== arg); saveLib(); render(); break;
    case "closeView": closeView(); break;
    case "pick": pick(parseInt(arg, 10)); break;
    case "check": doCheck(); break;
    case "nextQ": nextQ(); break;
    case "retry": startQuiz(quiz.wrong, quiz.mode, { title: quiz.title, retry: true }); break;
    case "again": startQuiz(quiz.items.map((x) => x.raw), quiz.mode, { title: quiz.title, retry: true }); break;
    case "copyLesson": navigator.clipboard.writeText(plainText(lessonOpen)).then(() => { $("copyL").textContent = t.copied; setTimeout(() => { const b = $("copyL"); if (b) b.textContent = t.copy; }, 1500); }).catch(() => {}); break;
    case "printPage": window.print(); break;
    case "about": openAbout(arg === "offers"); break;
    case "closeAbout": closeSheet("aboutSheet"); break;
    case "newSource": clearFile("lesson"); clearFile("style"); $("fText").value = ""; updateSrcBar(); break;
    case "srcMode": stopTimer(); quiz = null; lessonOpen = null; closeSheet("viewSheet"); render(); openCreate(arg); break;
    case "copyPrompt": navigator.clipboard.writeText(buildPrompt(arg, (lessonOpen && lessonOpen.text) || "")).then(() => { const old = el.textContent; el.textContent = t.copiedShort; setTimeout(() => { el.textContent = old; }, 1600); }).catch(() => {}); break;
    case "logout": logout(); break;
    case "clearData": if (confirm(t.clearConfirm)) { lib = emptyLib(); saveLib(); render(); } break;
  }
});
$("codeIn").addEventListener("keydown", (e) => { if (e.key === "Enter") $("enterBtn").click(); });

/* ===================== start ===================== */
(function init() {
  try { localStorage.removeItem("yt_lib"); } catch (e) {}
  const sl = safeGet("yt_lang"); if (sl === "fr" || sl === "ar") lang = sl;
  applyLang();
  try { if (!sessionStorage.getItem("yt_tracked")) { sessionStorage.setItem("yt_tracked", "1"); track("visit"); } } catch (e) { track("visit"); }
  loadContent().then(() => {
    if (!$("aboutSheet").hidden) renderAbout();
    else if (REF && !safeGet("yt_code") && $("app").hidden) openAbout(false);
  });
  const saved = safeGet("yt_code");
  if (saved) { $("codeIn").value = saved; login(saved, true); }
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
})();
</script>
</body>
