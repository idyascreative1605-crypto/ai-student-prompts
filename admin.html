<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>YES TEST | لوحة الإدارة</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#01516e; --teal:#01707f; --aqua:#00a6a5; --orange:#fda301; --bg:#f1f6f7; --ink:#0e2a35; --muted:#5a7480; --line:#d5e2e6; --ok:#1b7f3b; --bad:#b3261e; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif; font-size: 16px; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 14px 60px; }
  header { background: linear-gradient(100deg, var(--navy), var(--teal)); color: #fff; padding: 14px 16px; border-radius: 0 0 18px 18px; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; }
  button { font: inherit; cursor: pointer; }
  .btn { border-radius: 10px; padding: 7px 14px; font-weight: 700; background: var(--teal); color: #fff; border: 1.5px solid var(--teal); }
  .btn.ghost { background: transparent; color: var(--teal); }
  .btn.warn { background: transparent; color: var(--bad); border-color: var(--bad); }
  .btn.orange { background: var(--orange); border-color: var(--orange); color: #1d2a30; }
  .btn.sm { padding: 4px 10px; font-size: 14px; }
  .btn[disabled] { opacity: .5; }
  textarea { font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; resize: vertical; line-height: 1.6; }
  .savebar { position: sticky; bottom: 0; background: linear-gradient(transparent, var(--bg) 30%); padding: 14px 0 6px; display: flex; gap: 8px; flex-wrap: wrap; }
  input, select { font: inherit; color: var(--ink); background: #fff; border: 1.5px solid var(--line); border-radius: 10px; padding: 8px 10px; width: 100%; }
  label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 3px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; align-items: end; }
  .tabs { display: flex; gap: 8px; margin-top: 16px; }
  .tab { flex: 1; padding: 9px; border-radius: 10px; border: 1.5px solid var(--line); background: #fff; font-weight: 500; }
  .tab.on { background: var(--teal); color: #fff; border-color: var(--teal); font-weight: 700; }
  .code { font-family: ui-monospace, Consolas, monospace; direction: ltr; font-size: 18px; font-weight: 700; letter-spacing: .06em; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 14px; }
  .pill { font-size: 12px; padding: 1px 9px; border-radius: 99px; background: #d3f0ef; color: var(--navy); }
  .pill.off { background: #fdecea; color: var(--bad); } .pill.exp { background: #fff0cc; color: #8a6400; }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 99px; z-index: 50; max-width: 90vw; }
  .toast.err { background: var(--bad); }
  .made { border: 2px solid var(--ok); background: #f1faf3; }
  .modes { display: flex; gap: 12px; flex-wrap: wrap; } .modes label { display: flex; gap: 6px; align-items: center; font-weight: 400; margin: 0; }
  .modes input { width: auto; accent-color: var(--teal); }
  table.vt { width: 100%; border-collapse: collapse; font-size: 14px; margin-top: 6px; } table.vt th, table.vt td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: start; } table.vt td.n { font-variant-numeric: tabular-nums; }
  table.ut { border-collapse: collapse; font-size: 13.5px; min-width: 1100px; width: 100%; } table.ut th { position: sticky; top: 0; background: #e5f0f1; cursor: pointer; white-space: nowrap; user-select: none; }
  table.ut th, table.ut td { padding: 5px 7px; border: 1px solid var(--line); text-align: start; white-space: nowrap; } table.ut td.n { font-variant-numeric: tabular-nums; text-align: center; }
  table.ut tr:nth-child(even) td { background: #fafcfc; } table.ut .cin { width: 100%; min-width: 110px; padding: 3px 6px; border: 1px solid transparent; border-radius: 6px; background: transparent; font-size: 13.5px; } table.ut .cin:hover, table.ut .cin:focus { border-color: var(--teal); background: #fff; }
  .twrap { overflow: auto; border: 1px solid var(--line); border-radius: 12px; background: #fff; max-height: 70vh; margin-top: 10px; }
  .sums { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 10px; margin-top: 14px; } .sums .card { margin: 0; padding: 10px 12px; text-align: center; } .sums b { font-size: 24px; display: block; line-height: 1.2; }
  .fchips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; } .fchip { padding: 3px 13px; border-radius: 99px; border: 1.5px solid var(--line); background: #fff; font-size: 14px; } .fchip.on { background: var(--teal); color: #fff; border-color: var(--teal); }
  .formula { direction: ltr; background: #f3f7f8; border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; overflow-x: auto; white-space: nowrap; }
  details summary { cursor: pointer; color: var(--teal); font-size: 14px; margin-top: 8px; }
</style>
</head>
<body>
<header><h1>YES TEST · لوحة الإدارة</h1><button class="btn ghost sm" id="logout" style="color:#fff;border-color:#fff" hidden>خروج</button></header>
<div class="wrap">

  <section id="login" class="card">
    <label for="tok">رمز الإدارة (ADMIN_TOKEN)</label>
    <input id="tok" type="password" autocomplete="off" dir="ltr">
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:400"><input type="checkbox" id="showTok" style="width:auto"> إظهار الرمز (تأكد أن لوحة المفاتيح على English)</label>
    <div class="actions"><button class="btn" id="loginBtn" type="button">دخول</button></div>
    <p class="muted" id="loginMsg"></p>
  </section>

  <section id="panel" hidden>
    <div class="tabs"><button class="tab on" data-tab="codes" type="button">الأكواد</button><button class="tab" data-tab="users" type="button">الجدول</button><button class="tab" data-tab="plans" type="button">الباقات</button><button class="tab" data-tab="content" type="button">المحتوى</button></div>

    <div id="codesTab">
      <div class="card">
        <b>إنشاء كود جديد</b>
        <div class="grid" style="margin-top:8px">
          <div><label for="nName">اسم الطالب</label><input id="nName" placeholder="اختياري"></div>
          <div><label for="nPhone">الهاتف</label><input id="nPhone" placeholder="اختياري" dir="ltr"></div>
          <div><label for="nPlan">الباقة</label><select id="nPlan"></select></div>
          <div><label for="nDays">المدة</label><select id="nDays">
            <option value="30">30 يوماً</option><option value="90">3 أشهر</option><option value="180">6 أشهر</option><option value="365">سنة</option><option value="7">7 أيام (تجربة)</option><option value="0">بدون انتهاء</option></select></div>
          <div><button class="btn orange" id="createBtn" type="button" style="width:100%">إنشاء</button></div>
        </div>
      </div>
      <div class="card made" id="made" hidden></div>
      <div class="card"><label for="q">بحث</label><input id="q" placeholder="كود أو اسم">
        <div class="actions"><button class="btn sm ghost" id="exportBtn" type="button">تصدير Excel (.xlsx)</button></div></div>
      <div id="codeList"></div>
    </div>

    <div id="usersTab" hidden></div>
    <div id="plansTab" hidden></div>
    <div id="contentTab" hidden></div>
  </section>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const WORKER_URL = "https://student-ai.idyascreative1605.workers.dev";
const SITE_URL = "https://idyascreative1605-crypto.github.io/ai-student-prompts/";
const MODE_LABEL = { qcs: "QCS", qcm: "QCM", summary: "تلخيص", memorize: "حفظ", review: "مراجعة", visual: "مخطط بصري", stickynotes: "ملاحظات لاصقة", handwritten: "بخط اليد" };
const ALL_MODES = ["qcs", "qcm", "summary", "memorize", "review", "visual", "stickynotes", "handwritten"];
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
let token = "", data = { plans: [], codes: [], today: "" }, lastErr = null;

function toast(msg, err) {
  const t = $("toast"); t.textContent = msg; t.className = "toast" + (err ? " err" : ""); t.hidden = false;
  clearTimeout(toast.id); toast.id = setTimeout(() => { t.hidden = true; }, 2600);
}
async function api(action, extra) {
  try {
    const res = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action, token, ...(extra || {}) }) });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) { lastErr = { status: res.status, reason: d.reason || "", error: d.error || "" }; toast(d.error || "خطأ", true); return null; }
    return d;
  } catch (e) { lastErr = { status: 0, reason: "network" }; toast("تعذّر الاتصال بالخدمة", true); return null; }
}
async function refresh() {
  const d = await api("admin_overview"); if (!d) return false;
  data = d; renderPlanSelect(); renderCodes(); renderUsers(); renderPlans(); return true;
}
async function doLogin() {
  token = $("tok").value.trim(); if (!token) return;
  $("loginBtn").disabled = true;
  const ok = await refresh();
  $("loginBtn").disabled = false;
  if (ok) { try { sessionStorage.setItem("yt_admin", token); } catch (e) {} $("login").hidden = true; $("panel").hidden = false; $("logout").hidden = false; }
  else {
    const r = lastErr && lastErr.reason;
    $("loginMsg").textContent =
      r === "unauthorized" ? "الرمز غير صحيح. فعّل «إظهار الرمز» وتأكد من لغة لوحة المفاتيح (English) ومن عدم وجود حروف زائدة." :
      r === "throttled" ? "محاولات خاطئة كثيرة اليوم. انتظر حتى الغد، أو صفّر العدّاد من قاعدة البيانات (انظر التعليمات)." :
      r === "network" ? "تعذّر الاتصال بالخدمة. تحقق من الإنترنت." :
      "الخدمة غير جاهزة (تحقق من ربط القاعدة DB ومن نشر الـ Worker).";
  }
}
$("loginBtn").onclick = doLogin;
$("showTok").onchange = (e) => { $("tok").type = e.target.checked ? "text" : "password"; };
$("tok").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });
$("logout").onclick = () => { try { sessionStorage.removeItem("yt_admin"); } catch (e) {} location.reload(); };
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  $("codesTab").hidden = b.dataset.tab !== "codes"; $("usersTab").hidden = b.dataset.tab !== "users"; $("plansTab").hidden = b.dataset.tab !== "plans"; $("contentTab").hidden = b.dataset.tab !== "content";
  if (b.dataset.tab === "content" && !cdata) loadContentAdmin();
});

const planLabel = (n) => { const p = data.plans.find((x) => x.name === n); return p ? p.label : n; };
function renderPlanSelect() {
  $("nPlan").innerHTML = data.plans.map((p) => `<option value="${esc(p.name)}">${esc(p.label)} (${esc(p.name)})</option>`).join("");
}

/* ---------- codes ---------- */
function status(c) {
  if (!c.active) return '<span class="pill off">موقوف</span>';
  if (c.expires_at && c.expires_at < data.today) return '<span class="pill exp">منتهي</span>';
  return '<span class="pill">فعّال</span>';
}
function renderCodes() {
  const q = $("q").value.trim().toLowerCase();
  const list = data.codes.filter((c) => !q || c.code.toLowerCase().includes(q) || (c.student || "").toLowerCase().includes(q));
  $("codeList").innerHTML = list.length ? list.map((c) => `
    <div class="card" data-code="${esc(c.code)}">
      <div class="row"><span class="code">${esc(c.code)}</span>${status(c)}</div>
      <div class="muted">${esc(c.student || "بدون اسم")}${c.phone ? " · " + esc(c.phone) : ""} · ${c.expires_at ? "ينتهي " + esc(c.expires_at) : "بدون انتهاء"} · اليوم ${c.today} · الإجمالي ${c.total}</div>
      <div class="grid" style="margin-top:8px">
        <div><label>الباقة</label><select data-f="plan">${data.plans.map((p) => `<option value="${esc(p.name)}" ${p.name === c.plan ? "selected" : ""}>${esc(p.label)}</option>`).join("")}</select></div>
      </div>
      <details><summary>تخصيص هذا الكود</summary>
        <div class="grid" style="margin-top:6px">
          <div><label>أقصى أسئلة (فارغ = حسب الباقة)</label><input data-f="max_questions" type="number" min="1" max="100" value="${c.max_questions == null ? "" : c.max_questions}"></div>
          <div><label>عدد مرات الاستخدام (فارغ = حسب الباقة)</label><input data-f="daily_limit" type="number" min="0" max="1000" value="${c.daily_limit == null ? "" : c.daily_limit}"></div>
          <div><button class="btn sm" data-do="saveOverride" type="button">حفظ التخصيص</button></div>
        </div></details>
      <div class="actions">
        <button class="btn sm" data-do="extend" data-days="30" type="button">+30 يوم</button>
        <button class="btn sm" data-do="extend" data-days="90" type="button">+3 أشهر</button>
        <button class="btn sm ghost" data-do="toggle" type="button">${c.active ? "تعطيل" : "تفعيل"}</button>
        <button class="btn sm ghost" data-do="msg" type="button">نسخ رسالة</button>
        <button class="btn sm warn" data-do="delete" type="button">حذف</button>
      </div>
    </div>`).join("") : '<div class="card muted">لا توجد أكواد.</div>';
}
$("q").addEventListener("input", renderCodes);

function message(c) {
  const exp = c.expires_at ? "صالح حتى: " + c.expires_at : "بدون تاريخ انتهاء";
  return `مرحباً ${c.student || ""} 👋\nكودك في YES TEST: ${c.code}\nالباقة: ${planLabel(c.plan)}\n${exp}\nالرابط: ${SITE_URL}\nأدخل الكود في الصفحة الأولى للبدء.`;
}
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("تم النسخ"); } catch (e) { toast("تعذّر النسخ", true); } }

$("createBtn").onclick = async () => {
  $("createBtn").disabled = true;
  const d = await api("admin_create_code", { student: $("nName").value.trim(), plan: $("nPlan").value, days: parseInt($("nDays").value, 10), phone: $("nPhone").value.trim() });
  $("createBtn").disabled = false;
  if (!d) return;
  $("nName").value = ""; $("nPhone").value = "";
  await refresh();
  const c = { code: d.code, student: d.student, plan: d.plan, expires_at: d.expires_at };
  $("made").hidden = false;
  $("made").innerHTML = `<b>تم إنشاء الكود</b><div class="code" style="margin:6px 0">${esc(d.code)}</div>
    <div class="muted">${esc(planLabel(d.plan))} · ${d.expires_at ? "حتى " + esc(d.expires_at) : "بدون انتهاء"}</div>
    <div class="actions"><button class="btn sm" id="cpCode" type="button">نسخ الكود</button><button class="btn sm orange" id="cpMsg" type="button">نسخ رسالة للطالب</button></div>`;
  $("cpCode").onclick = () => copy(d.code); $("cpMsg").onclick = () => copy(message(c));
};

$("codeList").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-do]"); if (!b) return;
  const card = b.closest("[data-code]"), code = card.dataset.code, c = data.codes.find((x) => x.code === code);
  const act = b.dataset.do;
  if (act === "extend") { const d = await api("admin_extend", { code, days: parseInt(b.dataset.days, 10) }); if (d) { toast("تم التمديد حتى " + d.expires_at); refresh(); } }
  else if (act === "toggle") { const d = await api("admin_update_code", { code, fields: { active: c.active ? 0 : 1 } }); if (d) { toast("تم"); refresh(); } }
  else if (act === "delete") { if (confirm("حذف الكود " + code + " نهائياً؟")) { const d = await api("admin_delete_code", { code }); if (d) { toast("تم الحذف"); refresh(); } } }
  else if (act === "msg") copy(message(c));
  else if (act === "saveOverride") {
    const f = { max_questions: card.querySelector('[data-f=max_questions]').value, daily_limit: card.querySelector('[data-f=daily_limit]').value };
    const d = await api("admin_update_code", { code, fields: f }); if (d) { toast("تم الحفظ"); refresh(); }
  }
});
$("codeList").addEventListener("change", async (e) => {
  const s = e.target.closest('select[data-f=plan]'); if (!s) return;
  const code = s.closest("[data-code]").dataset.code;
  const d = await api("admin_update_code", { code, fields: { plan: s.value } }); if (d) { toast("تم تغيير الباقة"); refresh(); }
});

/* ---------- export: real .xlsx (no libraries, opens correctly in any Excel / Google Sheets) ---------- */
const CRC_T = (() => { const t = []; for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
function crc32(b) { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = CRC_T[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; }
function zipStore(files) {
  const enc = new TextEncoder(), parts = [], central = []; let offset = 0;
  const u16 = (n) => [n & 255, (n >> 8) & 255], u32 = (n) => [n & 255, (n >> 8) & 255, (n >> 16) & 255, (n >>> 24) & 255];
  files.forEach((f) => {
    const name = enc.encode(f.name), data = enc.encode(f.text), crc = crc32(data), size = data.length;
    const local = new Uint8Array([0x50, 0x4b, 3, 4, ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0)]);
    parts.push(local, name, data);
    central.push(new Uint8Array([0x50, 0x4b, 1, 2, ...u16(20), ...u16(20), ...u16(0x0800), ...u16(0), ...u16(0), ...u16(0x21), ...u32(crc), ...u32(size), ...u32(size), ...u16(name.length), ...u16(0), ...u16(0), ...u16(0), ...u16(0), ...u32(0), ...u32(offset)]), name);
    offset += local.length + name.length + data.length;
  });
  const cdSize = central.reduce((a, x) => a + x.length, 0);
  const end = new Uint8Array([0x50, 0x4b, 5, 6, ...u16(0), ...u16(0), ...u16(files.length), ...u16(files.length), ...u32(cdSize), ...u32(offset), ...u16(0)]);
  return new Blob([...parts, ...central, end], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
}
const xmlEsc = (v) => String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
function colName(i) { return String.fromCharCode(65 + i); }
function buildXlsx(head, rows) {
  const cell = (v, r, c, style) => {
    const ref = colName(c) + r, st = style ? ' s="1"' : "";
    return typeof v === "number" ? `<c r="${ref}"${st}><v>${v}</v></c>` : `<c r="${ref}" t="inlineStr"${st}><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
  };
  const all = [head, ...rows];
  const sheetRows = all.map((row, i) => `<row r="${i + 1}">${row.map((v, c) => cell(v, i + 1, c, i === 0)).join("")}</row>`).join("");
  const widths = [18, 22, 15, 14, 10, 14, 14, 8, 10, 20, 28];
  const X = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n';
  const NS = 'xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"';
  return zipStore([
    { name: "[Content_Types].xml", text: X + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>' },
    { name: "_rels/.rels", text: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>' },
    { name: "xl/workbook.xml", text: X + `<workbook ${NS} xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Codes" sheetId="1" r:id="rId1"/></sheets></workbook>` },
    { name: "xl/_rels/workbook.xml.rels", text: X + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>' },
    { name: "xl/styles.xml", text: X + `<styleSheet ${NS}><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>` },
    { name: "xl/worksheets/sheet1.xml", text: X + `<worksheet ${NS}><sheetViews><sheetView workbookViewId="0" rightToLeft="1"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${widths.map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join("")}</cols><sheetData>${sheetRows}</sheetData></worksheet>` }
  ]);
}
const statusKey = (c) => (!c.active ? "off" : (c.expires_at && c.expires_at < data.today ? "exp" : "on"));
const STATUS_TXT = { on: "فعّال", exp: "منتهي", off: "موقوف" };
function exportTable() {
  const head = ["الكود", "الطالب", "الهاتف", "الباقة", "الحالة", "ينتهي في", "آخر استعمال", "اليوم", "الإجمالي", "تاريخ الإنشاء", "ملاحظة"];
  const rows = data.codes.map((c) => [c.code, c.student || "", c.phone || "", planLabel(c.plan), STATUS_TXT[statusKey(c)],
    c.expires_at || "", c.last_day || "", Number(c.today) || 0, Number(c.total) || 0, c.created_at, c.note || ""]);
  return { head, rows };
}
function downloadXlsx() {
  const t = exportTable(), a = document.createElement("a");
  a.href = URL.createObjectURL(buildXlsx(t.head, t.rows));
  a.download = "yestest-users-" + data.today + ".xlsx";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  toast("تم تنزيل الملف");
}
$("exportBtn").onclick = downloadXlsx;

/* ---------- users table (spreadsheet view) ---------- */
let usort = { k: "created_at", d: -1 }, ufilter = "all", uq = "";
function renderUsers() {
  const box = $("usersTab"); if (!box) return;
  const cs = data.codes, cnt = { all: cs.length, on: 0, exp: 0, off: 0 };
  cs.forEach((c) => { cnt[statusKey(c)]++; });
  const usedToday = cs.filter((c) => c.today > 0).length, totalReq = cs.reduce((a, c) => a + (Number(c.total) || 0), 0);
  const val = (c, k) => k === "status" ? statusKey(c) : k === "plan" ? planLabel(c.plan) : c[k];
  let list = cs.filter((c) => (ufilter === "all" || statusKey(c) === ufilter) &&
    (!uq || [c.code, c.student, c.phone, c.note].some((x) => String(x || "").toLowerCase().includes(uq))));
  list.sort((a, b) => { const x = val(a, usort.k), y = val(b, usort.k); if (x == null || x === "") return 1; if (y == null || y === "") return -1;
    return (typeof x === "number" && typeof y === "number" ? x - y : String(x).localeCompare(String(y))) * usort.d; });
  const th = (k, label) => `<th data-sort="${k}">${label}${usort.k === k ? (usort.d > 0 ? " ▲" : " ▼") : ""}</th>`;
  const cin = (c, f) => `<input class="cin" data-edit="${f}" data-code="${esc(c.code)}" value="${esc(c[f] || "")}" ${f === "phone" ? 'dir="ltr"' : ""}>`;
  const pill = (c) => { const k = statusKey(c); return `<span class="pill ${k === "on" ? "" : k}">${STATUS_TXT[k]}</span>`; };
  const filters = [["all", "الكل"], ["on", "فعّال"], ["exp", "منتهي"], ["off", "موقوف"]];
  box.innerHTML = `
    <div class="sums"><div class="card"><b>${cnt.all}</b><span class="muted">الأكواد</span></div><div class="card"><b>${cnt.on}</b><span class="muted">فعّال</span></div>
      <div class="card"><b>${cnt.exp}</b><span class="muted">منتهي</span></div><div class="card"><b>${usedToday}</b><span class="muted">استعملوا اليوم</span></div><div class="card"><b>${totalReq}</b><span class="muted">إجمالي الطلبات</span></div></div>
    <div class="card"><div class="grid"><div><label for="uq">بحث (اسم، هاتف، كود، ملاحظة)</label><input id="uq" value="${esc(uq)}"></div></div>
      <div class="fchips">${filters.map((f) => `<button class="fchip ${ufilter === f[0] ? "on" : ""}" data-filter="${f[0]}" type="button">${f[1]} (${cnt[f[0]]})</button>`).join("")}</div>
      <div class="actions"><button class="btn sm orange" data-udo="copy" type="button">نسخ الجدول للصقه في Google Sheets</button><button class="btn sm" data-udo="xlsx" type="button">تصدير Excel (.xlsx)</button></div>
      <details><summary>ربط حيّ مع Google Sheets (يتحدّث تلقائياً)</summary>
        <ol style="margin:.5em 0;padding-inline-start:1.3em"><li>في Cloudflare: Worker ثم Paramètres ثم Variables et secrets، أضف سراً (Secret) اسمه <b dir="ltr">SHEET_KEY</b> بقيمة طويلة عشوائية (حروف وأرقام).</li>
          <li>في Google Sheets اكتب في الخلية A1 هذه الصيغة (بدّل الكلمة الأخيرة بمفتاحك):</li></ol>
        <div class="formula" id="formula">=IMPORTDATA("${WORKER_URL}/export?key=ضع_المفتاح_هنا")</div>
        <div class="actions"><button class="btn sm ghost" data-udo="formula" type="button">نسخ الصيغة</button></div>
        <p class="muted">للحصول على Excel: من Google Sheets اختر File ثم Download ثم Microsoft Excel (.xlsx). ولا تشارك الشيت علناً، فالمفتاح ظاهر لكل من يستطيع تعديله.</p></details></div>
    <div class="twrap"><table class="ut"><tr><th>#</th>${th("code", "الكود")}${th("student", "الطالب")}${th("phone", "الهاتف")}${th("plan", "الباقة")}${th("status", "الحالة")}${th("expires_at", "ينتهي في")}${th("last_day", "آخر استعمال")}${th("today", "اليوم")}${th("total", "الإجمالي")}${th("created_at", "الإنشاء")}${th("note", "ملاحظة")}</tr>
      ${list.map((c, i) => `<tr><td class="n">${i + 1}</td><td dir="ltr"><b>${esc(c.code)}</b></td><td>${cin(c, "student")}</td><td>${cin(c, "phone")}</td><td>${esc(planLabel(c.plan))}</td><td>${pill(c)}</td><td dir="ltr">${esc(c.expires_at || "—")}</td><td dir="ltr">${esc(c.last_day || "—")}</td><td class="n">${c.today}</td><td class="n">${c.total}</td><td dir="ltr">${esc((c.created_at || "").slice(0, 10))}</td><td>${cin(c, "note")}</td></tr>`).join("") || '<tr><td colspan="12" class="muted">لا نتائج.</td></tr>'}
    </table></div><p class="muted">اضغط عنوان أي عمود للترتيب. وعدّل الاسم والهاتف والملاحظة مباشرة داخل الجدول، فتُحفظ فور الخروج من الخانة.</p>`;
}
$("usersTab").addEventListener("click", async (e) => {
  const th = e.target.closest("th[data-sort]"), fc = e.target.closest("[data-filter]"), b = e.target.closest("[data-udo]");
  if (th) { const k = th.dataset.sort; usort = { k, d: usort.k === k ? -usort.d : 1 }; renderUsers(); }
  else if (fc) { ufilter = fc.dataset.filter; renderUsers(); }
  else if (b) {
    if (b.dataset.udo === "xlsx") downloadXlsx();
    else if (b.dataset.udo === "formula") copy($("formula").textContent);
    else if (b.dataset.udo === "copy") {
      const t = exportTable(), clean = (v) => String(v == null ? "" : v).replace(/[\t\r\n]+/g, " ");
      copy([t.head, ...t.rows].map((r) => r.map(clean).join("\t")).join("\n")).then(() => toast("نُسخ الجدول. افتح Google Sheets والصق بـ Ctrl+V"));
    }
  }
});
$("usersTab").addEventListener("input", (e) => { if (e.target.id === "uq") { uq = e.target.value.trim().toLowerCase(); const pos = e.target.selectionStart; renderUsers(); const n = $("uq"); n.focus(); n.setSelectionRange(pos, pos); } });
$("usersTab").addEventListener("change", async (e) => {
  const el = e.target.closest("[data-edit]"); if (!el) return;
  const code = el.dataset.code, f = el.dataset.edit, v = el.value.trim();
  const d = await api("admin_update_code", { code, fields: { [f]: v } });
  if (d) { const c = data.codes.find((x) => x.code === code); if (c) c[f] = v; renderCodes(); toast("تم الحفظ"); }
});

/* ---------- site content (about, features, offers, contact, ChatGPT prompt) ---------- */
let cdata = null;
const ta = (label, p, v, rows) => `<div style="margin-top:8px"><label>${label}</label><textarea data-p="${p}" rows="${rows || 3}">${esc(v)}</textarea></div>`;
const inp = (label, p, v) => `<div><label>${label}</label><input data-p="${p}" value="${esc(v)}"></div>`;
async function loadContentAdmin() {
  const d = await api("content");
  if (d && d.content) { cdata = d.content; renderContent(); }
}
function offerEd(o, i) {
  const f = (label, k, v) => `<div><label>${label}</label><input data-f="${k}" value="${esc(v)}"></div>`;
  const fa = (label, k, v) => `<div style="grid-column:1/-1"><label>${label}</label><textarea data-f="${k}" rows="4">${esc(v)}</textarea></div>`;
  return `<div class="card offer-ed" data-i="${i}"><div class="row"><b>عرض ${i + 1}</b><button class="btn sm warn" data-do="delOffer" type="button">حذف</button></div>
    <div class="grid" style="margin-top:8px">${f("العنوان (عربي)", "title.ar", o.title.ar)}${f("Titre (FR)", "title.fr", o.title.fr)}${f("السعر (عربي)", "price.ar", o.price.ar)}${f("Prix (FR)", "price.fr", o.price.fr)}${f("شارة، مثل: الأكثر طلباً", "badge.ar", o.badge.ar)}${f("Badge (FR)", "badge.fr", o.badge.fr)}
    ${fa("المزايا (عربي) — كل ميزة في سطر", "perks.ar", o.perks.ar)}${fa("Avantages (FR) — un par ligne", "perks.fr", o.perks.fr)}</div>
    <label style="display:flex;gap:8px;align-items:center;margin-top:8px;font-weight:400"><input type="checkbox" data-f="highlight" style="width:auto" ${o.highlight ? "checked" : ""}> تمييز هذا العرض (إطار برتقالي)</label></div>`;
}
async function loadVisits() {
  const d = await api("admin_visits"); const box = $("visitsBox"); if (!box) return;
  if (!d) return;
  const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "—");
  box.innerHTML = d.refs.length ? `<table class="vt"><tr><th>الرابط (ref)</th><th>زيارات: اليوم / 7 أيام / الكل</th><th>طلبات واتساب</th><th>نسبة</th></tr>` +
    d.refs.map((r) => `<tr><td dir="ltr">${esc(r.ref)}</td><td class="n">${r.visitsToday} / ${r.visits7} / ${r.visits}</td><td class="n">${r.wa}</td><td class="n">${pct(r.wa, r.visits)}</td></tr>`).join("") + `</table>` : '<p class="muted">لا زيارات مسجّلة بعد.</p>';
}
function renderContent() {
  const c = cdata;
  let h = `<div class="card"><b>الزيارات وطلبات واتساب</b><p class="muted">أضف <b dir="ltr">?ref=اسم</b> لأي رابط تنشره، مثل <b dir="ltr">?ref=fb</b> أو <b dir="ltr">?ref=tg</b>، فتعرف أي قناة تجلب أكثر. والرمز المضاف إلى الصور يستعمل <b dir="ltr">?ref=share</b>.</p><div id="visitsBox"><p class="muted">…</p></div></div>`;
  h += `<div class="card"><b>نبذة عن التطبيق</b>${ta("بالعربية", "about.ar", c.about.ar, 4)}${ta("Français", "about.fr", c.about.fr, 4)}</div>`;
  h += `<div class="card"><b>المزايا</b><p class="muted">اكتب كل ميزة في سطر مستقل.</p>${ta("بالعربية", "features.ar", c.features.ar, 7)}${ta("Français", "features.fr", c.features.fr, 7)}</div>`;
  h += `<div class="card"><b>الاشتراكات (العروض)</b><p class="muted">تظهر للطالب في صفحة «الاشتراكات والمزايا». لا تنسَ كتابة الأسعار الفعلية.</p><div id="offersBox">${c.offers.map(offerEd).join("")}</div><div class="actions"><button class="btn sm ghost" data-do="addOffer" type="button">+ إضافة عرض</button><button class="btn sm" data-do="offersTemplate" type="button">تحميل قالب العروض (مجاني / 300 / 500 / 900 دج)</button></div></div>`;
  h += `<div class="card"><b>التواصل للاشتراك</b><div class="grid" style="margin-top:8px">${inp("رابط واتساب (يبدأ بـ https://)", "contact_url", c.contact_url)}${inp("نص الزر (عربي)", "contact_text.ar", c.contact_text.ar)}${inp("Texte du bouton (FR)", "contact_text.fr", c.contact_text.fr)}</div><p class="muted">مثال الرابط: https://wa.me/213XXXXXXXXX</p>
    <b style="display:block;margin-top:12px">خدمة العملاء (تظهر في صفحة الاشتراكات)</b>${ta("العنوان — عربي", "support.title.ar", (c.support || {title:{}}).title.ar || "", 1)}${ta("Titre — FR", "support.title.fr", (c.support || {title:{}}).title.fr || "", 1)}${ta("النص — عربي (ضع رقم واتساب فيه)", "support.text.ar", (c.support || {text:{}}).text.ar || "", 3)}${ta("Texte — FR", "support.text.fr", (c.support || {text:{}}).text.fr || "", 3)}</div>`;
  h += `<div class="card"><b>برومت المخطط البصري (يظهر تحت الملخص)</b><p class="muted">اكتب <b dir="ltr">{{SUMMARY}}</b> في المكان الذي سيُدرج فيه الملخص تلقائياً. وفي النص الافتراضي شريط التعريف السفلي (اسم التطبيق والرابط ورقم واتساب)، فعدّله هنا إن تغيّر أي منها.</p>
    ${ta("بالعربية", "prompts.infographic.ar", c.prompts.infographic.ar, 14)}${ta("Français", "prompts.infographic.fr", c.prompts.infographic.fr, 14)}</div>`;
  h += `<div class="savebar"><button class="btn orange" data-do="saveContent" type="button">حفظ التغييرات</button><button class="btn ghost" data-do="resetContent" type="button">استعادة النصوص الافتراضية</button></div>`;
  $("contentTab").innerHTML = h;
  loadVisits();
}
function collectContent() {
  const root = $("contentTab"), g = (p) => { const el = root.querySelector(`[data-p="${p}"]`); return el ? el.value : ""; };
  const offers = [...root.querySelectorAll(".offer-ed")].map((el) => {
    const f = (k) => el.querySelector(`[data-f="${k}"]`).value;
    return { title: { ar: f("title.ar"), fr: f("title.fr") }, price: { ar: f("price.ar"), fr: f("price.fr") }, badge: { ar: f("badge.ar"), fr: f("badge.fr") },
      perks: { ar: f("perks.ar"), fr: f("perks.fr") }, highlight: el.querySelector('[data-f="highlight"]').checked };
  });
  return { about: { ar: g("about.ar"), fr: g("about.fr") }, features: { ar: g("features.ar"), fr: g("features.fr") }, offers,
    contact_url: g("contact_url"), contact_text: { ar: g("contact_text.ar"), fr: g("contact_text.fr") },
    support: { title: { ar: g("support.title.ar"), fr: g("support.title.fr") }, text: { ar: g("support.text.ar"), fr: g("support.text.fr") } },
    prompts: { infographic: { ar: g("prompts.infographic.ar"), fr: g("prompts.infographic.fr") } } };
}
$("contentTab").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-do]"); if (!b) return;
  const act = b.dataset.do;
  if (act === "addOffer") { cdata = collectContent(); if (cdata.offers.length >= 6) return toast("الحد الأقصى 6 عروض", true); cdata.offers.push({ title: { ar: "", fr: "" }, price: { ar: "", fr: "" }, badge: { ar: "", fr: "" }, perks: { ar: "", fr: "" }, highlight: false }); renderContent(); }
  else if (act === "offersTemplate") {
    if (!confirm("استبدال العروض الحالية بقالب العروض الجديد؟ لن يُحفظ شيء حتى تضغط «حفظ التغييرات».")) return;
    const d = await api("content_defaults"); if (!d || !d.content) return;
    cdata = collectContent(); cdata.offers = d.content.offers; cdata.support = d.content.support; renderContent(); toast("تم التحميل. راجع الأسعار ثم اضغط «حفظ التغييرات»");
  }
  else if (act === "delOffer") { const i = +b.closest(".offer-ed").dataset.i; cdata = collectContent(); cdata.offers.splice(i, 1); renderContent(); }
  else if (act === "saveContent") {
    const url = collectContent().contact_url.trim();
    if (url && !/^https?:\/\//i.test(url)) return toast("رابط التواصل يجب أن يبدأ بـ https://", true);
    b.disabled = true; const d = await api("admin_save_content", { content: collectContent() }); b.disabled = false;
    if (d && d.content) { cdata = d.content; renderContent(); toast("تم الحفظ، وتظهر التغييرات للطلبة فوراً"); }
  }
  else if (act === "resetContent") { if (confirm("استعادة كل النصوص الافتراضية؟ ستضيع تعديلاتك.")) { const d = await api("admin_reset_content"); if (d && d.content) { cdata = d.content; renderContent(); toast("تمت الاستعادة"); } } }
});

/* ---------- plans ---------- */
function planCard(p, isNew) {
  const modes = isNew ? ["summary", "qcm", "qcs"] : String(p.modes || "").split(",");
  return `<div class="card" data-plan="${esc(p.name || "")}">
    <div class="row"><b>${isNew ? "باقة جديدة" : esc(p.label) + " · " + esc(p.name) + (p.quota_type === "total" ? " (تجربة)" : "")}</b></div>
    <div class="grid" style="margin-top:8px">
      ${isNew ? `<div><label>الاسم الداخلي (لاتيني)</label><input data-f="name" dir="ltr" placeholder="plus"></div>` : ""}
      <div><label>الاسم الظاهر</label><input data-f="label" value="${esc(p.label || "")}"></div>
      <div><label>أقصى عدد أسئلة</label><input data-f="max_questions" type="number" min="1" max="100" value="${p.max_questions ?? 5}"></div>
      <div><label>عدد مرات الاستخدام</label><input data-f="daily_limit" type="number" min="0" max="1000" value="${p.daily_limit ?? 5}"></div>
      <div><label>نوع الرصيد</label><select data-f="quota_type"><option value="daily" ${p.quota_type !== "total" ? "selected" : ""}>يومي (يتجدد كل يوم)</option><option value="total" ${p.quota_type === "total" ? "selected" : ""}>إجمالي (تجربة مرة واحدة)</option></select></div>
      <div><label>أقصى حجم ملف (ميغا)</label><input data-f="max_file_mb" type="number" min="1" max="20" value="${p.max_file_mb ?? 5}"></div>
    </div>
    <div class="modes" style="margin-top:10px">${ALL_MODES.map((m) => `<label><input type="checkbox" data-m="${m}" ${modes.includes(m) ? "checked" : ""}>${MODE_LABEL[m]}</label>`).join("")}</div>
    <div class="actions"><button class="btn sm" data-do="savePlan" type="button">حفظ</button></div></div>`;
}
function renderPlans() {
  $("plansTab").innerHTML = data.plans.map((p) => planCard(p, false)).join("") + planCard({}, true);
}
$("plansTab").addEventListener("click", async (e) => {
  const b = e.target.closest('[data-do=savePlan]'); if (!b) return;
  const card = b.closest("[data-plan]"), g = (f) => { const el = card.querySelector(`[data-f=${f}]`); return el ? el.value : undefined; };
  const name = card.dataset.plan || g("name");
  const modes = [...card.querySelectorAll("[data-m]")].filter((x) => x.checked).map((x) => x.dataset.m).join(",");
  const d = await api("admin_save_plan", { plan: { name, label: g("label"), max_questions: g("max_questions"), daily_limit: g("daily_limit"), quota_type: g("quota_type"), max_file_mb: g("max_file_mb"), modes } });
  if (d) { toast("تم حفظ الباقة"); refresh(); }
});

/* auto-login within the same browser tab session */
try { const t = sessionStorage.getItem("yt_admin"); if (t) { $("tok").value = t; doLogin(); } } catch (e) {}
</script>
